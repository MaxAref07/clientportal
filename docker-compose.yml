services:
  postgres:
    image: postgres:17
    container_name: clientportal-db
    environment:
      POSTGRES_DB: clientportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - clientportal-pgdata:/var/lib/postgresql/data

volumes:
  clientportal-pgdata: